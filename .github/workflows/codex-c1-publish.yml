name: Sync university index C1

on:
  push:
    branches:
      - codex/university-index-c1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/university-index-c1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Apply validated university index files
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { brotliDecompressSync } = require('node:zlib');
          const parts = [1, 2, 3, 4, 5].map((index) => fs.readFileSync(`.codex-transfer/c1.part${index}`, 'utf8').trim());
          parts[3] = parts[3].replace('RF1schtX', 'RF1uschtX');
          const files = JSON.parse(brotliDecompressSync(Buffer.from(parts.join(''), 'base64')).toString('utf8'));
          for (const [filename, content] of Object.entries(files)) {
            fs.mkdirSync(path.dirname(filename), { recursive: true });
            fs.writeFileSync(filename, content, 'utf8');
          }
          NODE
      - name: Commit clean source changes
        run: |
          git rm --ignore-unmatch .github/workflows/codex-c1-publish.yml .codex-transfer/c1.part1 .codex-transfer/c1.part2 .codex-transfer/c1.part3 .codex-transfer/c1.part4 .codex-transfer/c1.part5
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/universities.json docs/university-index-guide.md src/lib/retrieve.js src/lib/chatAgent.js src/components/ChatBox.jsx src/data/prompts.js api/chat.js README.md scripts/generate-university-index.mjs
          git commit -m "Build official 985 and 211 university base index"
          git push origin HEAD:codex/university-index-c1
