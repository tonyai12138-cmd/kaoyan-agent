name: Codex C3 publish source changes

on:
  push:
    branches: [codex/official-major-samples-c3]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/official-major-samples-c3
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Restore checked source files
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const zlib = require('node:zlib');
          const crypto = require('node:crypto');
          const allowed = new Set([
            'README.md',
            'api/chat.js',
            'docs/university-index-guide.md',
            'scripts/generate-university-index.mjs',
            'src/components/ChatBox.jsx',
            'src/data/prompts.js',
            'src/data/schools.json',
            'src/lib/chatAgent.js',
            'src/lib/knowledgeLinks.js',
            'src/lib/retrieve.js',
          ]);
          const encoded = Array.from({ length: 8 }, (_, i) => fs.readFileSync(`.codex-transfer/c3.part${i + 1}`, 'utf8').trim()).join('');
          const digest = crypto.createHash('sha256').update(encoded).digest('hex');
          if (digest !== '1ee394c4b33ed5e4626ca63aad909476f9c425d2fd95f7345f00543d63e8c8b5') throw new Error(`payload checksum mismatch: ${digest}`);
          const payload = JSON.parse(zlib.brotliDecompressSync(Buffer.from(encoded, 'base64')).toString('utf8'));
          if (Object.keys(payload).some((file) => !allowed.has(file)) || Object.keys(payload).length !== allowed.size) throw new Error('unexpected source files in payload');
          for (const [file, contents] of Object.entries(payload)) {
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.writeFileSync(file, contents, 'utf8');
          }
          NODE
      - name: Generate university links and validate data
        run: |
          node scripts/generate-university-index.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const schools = JSON.parse(fs.readFileSync('src/data/schools.json', 'utf8'));
          const universities = JSON.parse(fs.readFileSync('src/data/universities.json', 'utf8'));
          const records = schools.items || schools.records || schools.data || [];
          const institutionRecords = universities.items || universities.records || universities.data || [];
          const officialSamples = records.filter((record) => record.id.startsWith('official_major_'));
          if (officialSamples.length !== 9) throw new Error(`expected 9 official samples, found ${officialSamples.length}`);
          if (officialSamples.some((record) => record.professionalDataLevel !== 'partial' || record.dataStatus !== 'partial' || record.source?.sourceType !== 'school_official' || !record.source?.sourceUrl || !record.source?.checkedAt || !record.source?.reliability)) throw new Error('official professional sample status/source validation failed');
          if (institutionRecords.length !== 112) throw new Error(`expected 112 university records, found ${institutionRecords.length}`);
          const linked = institutionRecords.filter((record) => record.hasMajorKnowledge);
          if (linked.length !== 5 || linked.some((record) => record.majorDataStatus !== 'partial')) throw new Error('university professional linkage validation failed');
          console.log(`Validated ${officialSamples.length} partial professional samples linked to ${linked.length} university records.`);
          NODE
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Commit published source files
        run: |
          git rm --ignore-unmatch .github/workflows/codex-c3-publish.yml .codex-transfer/c3.part1 .codex-transfer/c3.part2 .codex-transfer/c3.part3 .codex-transfer/c3.part4 .codex-transfer/c3.part5 .codex-transfer/c3.part6 .codex-transfer/c3.part7 .codex-transfer/c3.part8
          git add README.md api/chat.js docs/university-index-guide.md scripts/generate-university-index.mjs src/components/ChatBox.jsx src/data/prompts.js src/data/schools.json src/data/universities.json src/lib/chatAgent.js src/lib/knowledgeLinks.js src/lib/retrieve.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Add official partial professional data samples"
          git push origin HEAD:codex/official-major-samples-c3
